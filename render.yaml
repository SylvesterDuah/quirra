# render.yaml
services:
  - type: web
    name: quirra-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput || true
    # run migrations, then start gunicorn
    startCommand: bash -lc "python manage.py migrate --noinput && gunicorn quirra.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /              
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: QUIRRA_USER_SALT
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: quirra-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"

databases:
  - name: quirra-db
    plan: free
    ipAllowList: []
