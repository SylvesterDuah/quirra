# render.yaml
services:
  - type: web
    name: quirra-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput || true
    startCommand: gunicorn quirra.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: QUIRRA_USER_SALT
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: quirra-db
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"
      # tighten later:
      # - key: CORS_ALLOWED_ORIGINS
      #   value: https://your-frontend.vercel.app
      # - key: CSRF_TRUSTED_ORIGINS
      #   value: https://your-frontend.vercel.app
      # - key: INGEST_SECRET
      #   value: paste-a-long-secret
    postDeployCommand: python manage.py migrate

databases:
  - name: quirra-db
    plan: free
    postgresMajorVersion: 15
    ipAllowList: []
